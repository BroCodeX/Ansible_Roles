---
- name: Fail for unsupported OS family
  ansible.builtin.fail:
    msg: >-
      Unsupported OS: {{ ansible_distribution }} (family: {{ ansible_os_family }}).
      Only Debian and RedHat families are supported.
  when:
    - ansible_os_family != "Debian"
    - ansible_os_family != "RedHat"

- name: Install required system utilities on Debian family
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - openssl
      - ca-certificates
      - sshpass
      - openssh-client
      - rsync
      - unzip
      - tar
      - gzip
      - git
      - bash-completion
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_os_family == "Debian"

- name: Ensure EPEL repository is installed
  ansible.builtin.dnf:
    name: epel-release
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == "RedHat"

- name: Install required system utilities on AlmaLinux
  ansible.builtin.dnf:
    name:
      - sudo
      - python3
      - python3-pip
      - openssl
      - ca-certificates
      - sshpass
      - openssh-clients
      - rsync
      - unzip
      - tar
      - gzip
      - git
      - bash-completion
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_os_family == "RedHat"
