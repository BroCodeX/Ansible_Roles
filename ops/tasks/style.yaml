- name: Validate supported shell
  ansible.builtin.assert:
    that:
      - shell in ['bash', 'zsh']
    fail_msg: "Unsupported shell '{{ shell }}'. Supported values: bash, zsh."

- name: Clone kube-ps1 repository
  ansible.builtin.git:
    repo: 'https://github.com/jonmosco/kube-ps1.git'
    dest: "{{ ansible_env.HOME }}/kube-ps1"
    version: master

- name: Bash. Configure shell RC file (dynamic KUBECONFIG and kube-ps1)
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    create: true
    marker: "# {mark} ANSIBLE MANAGED: kube-ps1 setup"
    block: |
      # dynamic KUBECONFIG
      export KUBECONFIG=~/.kube/config-$(date +%s)
      cp ~/.kube/config "$KUBECONFIG"
      export KUBE_PS1_NS_ENABLE=false
      source ~/kube-ps1/kube-ps1.sh
      PS1='[\u@\h:\W $(kube_ps1)]\$ '
  when: shell == "bash"

- name: Zsh. Configure shell RC file (dynamic KUBECONFIG and kube-ps1)
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    create: true
    marker: "# {mark} ANSIBLE MANAGED: kube-ps1 setup"
    block: |
      # dynamic KUBECONFIG
      export KUBECONFIG=~/.kube/config-$(date +%s)
      cp ~/.kube/config "$KUBECONFIG"
      export KUBE_PS1_NS_ENABLE=false
      if [ -f "${ZSH:-$HOME/.oh-my-zsh}/plugins/kube-ps1/kube-ps1.plugin.zsh" ]; then
        source "${ZSH:-$HOME/.oh-my-zsh}/plugins/kube-ps1/kube-ps1.plugin.zsh"
      else
        source ~/kube-ps1/kube-ps1.sh
      fi
      setopt prompt_subst
      PROMPT='$(kube_ps1)'$PROMPT
  when: shell == "zsh"

- name: Configure shell logout cleanup
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/{{ '.bash_logout' if shell == 'bash' else '.zlogout' }}"
    create: true
    marker: "# {mark} ANSIBLE MANAGED: cleanup"
    block: |
      if [ -n "$KUBECONFIG" ]; then
        if [ "$KUBECONFIG" != "$HOME/.kube/config" ]; then
          rm -f "$KUBECONFIG"
        fi
      fi

- name: Bash. Configure .bash_profile with k8s help
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bash_profile"
    create: true
    marker: "# {mark} ANSIBLE MANAGED: k8s info"
    block: |
      if [ -n "$BASH_VERSION" ]; then
          if [ -f "$HOME/.bashrc" ]; then
              . "$HOME/.bashrc"
          fi
      fi

      # k8s contexts
      YELLOW='\033[1;33m'
      LPURPLE='\033[1;35m'
      CYAN='\033[0;36m'
      NC='\033[0m'

      printf "${YELLOW}список k8s кластеров:${NC}\n"
      kubectl config get-contexts
      printf "${YELLOW}выбрать командой:${NC}\n${CYAN}kubectl config use-context${NC} ${LPURPLE}<context_name>${NC}\n"
  when: shell == "bash"

- name: Zsh. Configure .zprofile with k8s help
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zprofile"
    create: true
    marker: "# {mark} ANSIBLE MANAGED: k8s info"
    block: |
      if [[ -o interactive ]]; then
          # k8s contexts
          YELLOW='\033[1;33m'
          LPURPLE='\033[1;35m'
          CYAN='\033[0;36m'
          NC='\033[0m'

          printf "${YELLOW}список k8s кластеров:${NC}\n"
          kubectl config get-contexts
          printf "${YELLOW}выбрать командой:${NC}\n${CYAN}kubectl config use-context${NC} ${LPURPLE}<context_name>${NC}\n"
      fi
  when: shell == "zsh"
