---
- name: Check if OpenStack is installed.
  ansible.builtin.command: "{{ openstack_bin_path }} --version"
  register: openstack_check
  changed_when: false
  failed_when: false

- name: Get installed OpenStack package version.
  ansible.builtin.command: >-
    {{ openstack_venv_path }}/bin/python -m pip show {{ openstack_pip_package }}
  register: openstack_package_info
  changed_when: false
  failed_when: false
  when: openstack_check.rc == 0

- name: Set installed OpenStack version.
  ansible.builtin.set_fact:
    openstack_installed_version: >-
      {{ (openstack_package_info.stdout | regex_findall('Version:\s*([^\n\r]+)') | first) | default('') }}
  when: openstack_check.rc == 0

- name: Debug OpenStack version parsing.
  ansible.builtin.debug:
    msg:
      - "raw={{ openstack_package_info.stdout | default('') }}"
      - "parsed={{ openstack_installed_version | default('') }}"
      - "target={{ openstack_install_version }}"
  when: openstack_check.rc == 0

- name: Set OpenStack install state.
  ansible.builtin.set_fact:
    openstack_needs_install: >-
      {{ openstack_check.rc != 0
      or (
        (openstack_install_version | default('') | length) > 0
        and (openstack_installed_version | default('')) != openstack_install_version
      ) }}

- name: Install OpenStack CLI via virtualenv.
  ansible.builtin.pip:
    name: >-
      {{ openstack_pip_package }}{{ '==' ~ openstack_install_version
      if (openstack_install_version | default('') | length) > 0 else '' }}
    virtualenv: "{{ openstack_venv_path }}"
    virtualenv_command: python3 -m venv
    extra_args: >-
      {{ openstack_install_pip_extra_args
      if (openstack_install_pip_extra_args | default('') | length) > 0 else omit }}
  become: true
  when: openstack_needs_install | bool

- name: Install optional OpenStack components.
  ansible.builtin.pip:
    name: "{{ item }}"
    virtualenv: "{{ openstack_venv_path }}"
    virtualenv_command: virtualenv
    extra_args: >-
      {{ openstack_install_pip_extra_args
      if (openstack_install_pip_extra_args | default('') | length) > 0 else omit }}
  become: true
  loop: "{{ openstack_components }}"
  when: openstack_needs_install | bool

- name: Link OpenStack CLI binary.
  ansible.builtin.file:
    src: "{{ openstack_venv_path }}/bin/openstack"
    dest: "{{ openstack_bin_path }}"
    state: link
    force: true
  become: true
  when: openstack_needs_install | bool

- name: Get final Openstack CLI version.
  ansible.builtin.command: "{{ openstack_bin_path }} --version"
  register: openstack_final_version
  changed_when: false

- name: Display Openstack CLI version.
  ansible.builtin.debug:
    msg: "{{ openstack_final_version.stdout_lines | first }}"
  ignore_errors: true

- name: Ensure OpenStack RC dir exists.
  ansible.builtin.file:
    path: "{{ openstack_rc_dir }}"
    state: directory
    mode: "0700"

- name: Render OpenStack RC files.
  ansible.builtin.template:
    src: rcfile.j2
    dest: "{{ openstack_rc_dir }}/{{ openstack_rc_profile.value.filename | default(openstack_rc_profile.key ~ '.sh') }}"
    mode: "0600"
  loop: "{{ openstack_rc | dict2items }}"
  loop_control:
    loop_var: openstack_rc_profile
    label: "{{ openstack_rc_profile.key }}"
