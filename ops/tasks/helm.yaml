---
- name: Check if Helm binary exists.
  ansible.builtin.stat:
    path: "{{ helm_bin_path }}"
  register: helm_check

- name: Check Helm version.
  ansible.builtin.command: "{{ helm_bin_path }} version --short"
  changed_when: false
  failed_when: false
  register: helm_existing_version
  when: helm_check.stat.exists

- name: Set Helm install state.
  ansible.builtin.set_fact:
    helm_needs_install: >-
      {{ not helm_check.stat.exists
      or helm_version not in (helm_existing_version.stdout | default('')) }}

- name: Install Helm binary.
  block:
    - name: Download helm.
      ansible.builtin.unarchive:
        src: "{{ helm_repo_path }}/helm-{{ helm_version }}-{{ helm_platform }}-{{ helm_arch }}.tar.gz"
        dest: /tmp
        remote_src: true
        mode: "0755"

    - name: Copy helm binary into place.
      ansible.builtin.copy:
        src: "/tmp/{{ helm_platform }}-{{ helm_arch }}/helm"
        dest: "{{ helm_bin_path }}"
        mode: "0755"
        remote_src: true
      become: true
  always:
    - name: Remove Helm tmp dir.
      ansible.builtin.file:
        path: "/tmp/{{ helm_platform }}-{{ helm_arch }}"
        state: absent
  when: helm_needs_install | bool

- name: Check installed Helm plugins.
  ansible.builtin.command: "{{ helm_bin_path }} plugin list"
  register: helm_plugins
  changed_when: false
  failed_when: false

- name: Remove helm-diff plugin with wrong version.
  ansible.builtin.command: "{{ helm_bin_path }} plugin uninstall diff"
  when:
    - helm_plugins.rc == 0
    - "'diff' in helm_plugins.stdout"
    - helm_diff_version not in helm_plugins.stdout

- name: Install helm-diff plugin.
  ansible.builtin.command: >-
    {{ helm_bin_path }} plugin install https://github.com/databus23/helm-diff
    --version {{ helm_diff_version }}
    --verify=false
  when:
    - helm_plugins.rc == 0
    - "'diff' not in helm_plugins.stdout or helm_diff_version not in helm_plugins.stdout"

- name: Remove helm-secrets plugin with wrong version.
  ansible.builtin.command: "{{ helm_bin_path }} plugin uninstall secrets"
  when:
    - helm_plugins.rc == 0
    - "'secrets' in helm_plugins.stdout"
    - helm_secrets_version not in helm_plugins.stdout

- name: Install helm-secrets plugin.
  ansible.builtin.command: >-
    {{ helm_bin_path }} plugin install https://github.com/jkroepke/helm-secrets
    --version {{ helm_secrets_version }}
    --verify=false
  when:
    - helm_plugins.rc == 0
    - "'secrets' not in helm_plugins.stdout or helm_secrets_version not in helm_plugins.stdout"

- name: Get final Helm version.
  ansible.builtin.command: "{{ helm_bin_path }} version --short"
  register: helm_final_version
  changed_when: false

- name: Display Helm version.
  ansible.builtin.debug:
    msg: "{{ helm_final_version.stdout }}"

- name: Get final Helm plugin versions.
  ansible.builtin.command: "{{ helm_bin_path }} plugin list"
  register: helm_final_plugins
  changed_when: false

- name: Display Helm plugin versions.
  ansible.builtin.debug:
    msg: "{{ helm_final_plugins.stdout_lines }}"
