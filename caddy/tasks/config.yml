---
- name: Create conf.d directory
  ansible.builtin.file:
    path: "{{ caddy_conf_d_dir }}"
    state: directory
    owner: root
    group: "{{ caddy_group }}"
    mode: "0750"

- name: Deploy main Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_main_config }}"
    owner: root
    group: "{{ caddy_group }}"
    mode: "0640"
    backup: true
  notify: Reload caddy

- name: Create site log files
  ansible.builtin.file:
    path: "{{ caddy_log_dir }}/{{ item.domain }}.log"
    state: touch
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: "{{ caddy_log_mode }}"
    access_time: preserve
    modification_time: preserve
  loop: "{{ caddy_sites }}"
  loop_control:
    label: "{{ item.domain }}"
  when: item.state | default('present') != 'absent'

- name: Deploy site configs
  ansible.builtin.template:
    src: site.caddy.j2
    dest: "{{ caddy_conf_d_dir }}/{{ item.domain }}.caddy"
    owner: root
    group: "{{ caddy_group }}"
    mode: "0640"
  loop: "{{ caddy_sites }}"
  loop_control:
    label: "{{ item.domain }}"
  when: item.state | default('present') != 'absent'
  register: caddy_site_files
  no_log: true
  notify: Reload caddy

- name: Remove absent site configs
  ansible.builtin.file:
    path: "{{ caddy_conf_d_dir }}/{{ item.domain }}.caddy"
    state: absent
  loop: "{{ caddy_sites }}"
  loop_control:
    label: "{{ item.domain }}"
  when: item.state | default('present') == 'absent'
  notify: Reload caddy

- name: Check formatting of Caddy configs
  ansible.builtin.command:
    cmd: caddy fmt --diff {{ item }}
  loop: "{{ [caddy_main_config] + (caddy_site_files.results | selectattr('dest', 'defined') | map(attribute='dest') | list) }}"
  register: caddy_fmt_check
  changed_when: false
  failed_when: caddy_fmt_check.rc not in [0, 1]
  check_mode: false

- name: Format Caddy configs
  ansible.builtin.command:
    cmd: caddy fmt --overwrite {{ item.item }}
  loop: "{{ caddy_fmt_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.rc == 1
  notify: Reload caddy

- name: Validate Caddy configuration
  ansible.builtin.command:
    cmd: caddy validate --config {{ caddy_main_config }} --adapter caddyfile
  changed_when: false
  when: not ansible_check_mode

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: "{{ caddy_service_enabled }}"
    state: "{{ 'started' if caddy_service_enabled else 'stopped' }}"
  when: not ansible_check_mode
