---
# https://caddyserver.com/docs/install#debian-ubuntu-raspbian
- name: Install repo prerequisites
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download Caddy repo key
  ansible.builtin.get_url:
    url: "{{ caddy_apt_key_url }}"
    dest: /usr/share/keyrings/caddy-stable.gpg.key
    mode: "0644"
  register: caddy_apt_key

- name: Dearmor Caddy repo key
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o {{ caddy_apt_keyring }} /usr/share/keyrings/caddy-stable.gpg.key
  when: caddy_apt_key is changed
  changed_when: true

- name: Set keyring permissions
  ansible.builtin.file:
    path: "{{ caddy_apt_keyring }}"
    mode: "0644"
  when: not ansible_check_mode

- name: Add Caddy apt repository list
  ansible.builtin.get_url:
    url: "{{ caddy_apt_list_url }}"
    dest: /etc/apt/sources.list.d/caddy-stable.list
    mode: "0644"
  register: caddy_apt_list

- name: Install Caddy
  ansible.builtin.apt:
    name: "{{ caddy_package }}"
    state: "{{ caddy_package_state }}"
    update_cache: "{{ caddy_apt_list is changed }}"
