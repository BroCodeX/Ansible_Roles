---
- name: Install Caddy
  ansible.builtin.include_tasks:
    file: "install_{{ ansible_os_family | lower }}.yml"
    apply:
      become: true
      tags:
        - caddy
        - caddy_install
  tags:
    - caddy
    - caddy_install

- name: Configure Caddy
  ansible.builtin.import_tasks: config.yml
  become: true
  tags:
    - caddy
    - caddy_config
