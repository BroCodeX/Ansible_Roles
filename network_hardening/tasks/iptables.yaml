- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install iptables and persistence package (Debian family)
  ansible.builtin.apt:
    name: "{{ iptables_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Install iptables and persistence package (RedHat family)
  ansible.builtin.dnf:
    name: "{{ iptables_packages }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Stop and disable competing firewall services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop: "{{ iptables_conflicting_services }}"
  when:
    - (item ~ '.service') in ansible_facts.services
    - ansible_facts.services[item ~ '.service'].status | default('not-found') not in ['not-found', 'masked']

- name: Ensure rules directory exists
  ansible.builtin.file:
    path: "{{ iptables_rules_v4_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy IPv4 rules
  ansible.builtin.template:
    src: rules.v4.j2
    dest: "{{ iptables_rules_v4_path }}"
    owner: root
    group: root
    mode: '0600'
    backup: yes
  notify:
    - reload iptables
    - restart docker after iptables reload

- name: Deploy IPv6 rules
  ansible.builtin.template:
    src: rules.v6.j2
    dest: "{{ iptables_rules_v6_path }}"
    owner: root
    group: root
    mode: '0600'
    backup: yes
  notify:
    - reload iptables
    - restart docker after iptables reload

- name: Enable and start persistence services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop: "{{ iptables_services }}"
  # in --check the package isn't installed yet, so the service doesn't exist
  ignore_errors: "{{ ansible_check_mode }}"
