# {{ ansible_managed }}

name: {{ docker_compose_project_name }}

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:

  # Postgres
  postgres:
    image: {{ postgres_image }}
    volumes:
      - "postgres-data:/var/lib/postgresql"
    deploy:
      resources:
        limits:
          cpus: "{{ postgres_cpu_limit }}"
          memory: "{{ postgres_mem_limit }}"
          pids: "{{ postgres_pids_limit }}"
        reservations:
          cpus: "{{ postgres_cpu_reservation }}"
          memory: "{{ postgres_mem_reservation }}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges=true
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    networks:
      - db-net
    environment:
      POSTGRES_PASSWORD: "{{ postgres_password }}"
      POSTGRES_USER: "{{ postgres_user }}"
      POSTGRES_DB: "{{ postgres_db }}"
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ postgres_user }} -d {{ postgres_db }}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  db-net:
    name: db-net
    internal: true 

volumes:
  postgres-data:
