spec:
  inputs:
    playbook:
      description: "Select playbook to run"
      type: string
      options:
        - hardening
        - base
        - web
        - containers
        - logging
        - vault
        - backup
        - devops
      default: "hardening"
    limit:
      description: "Limit to host or group names (comma separated)"
      type: string
      default: "all"
    tags:
      description: "Tags names (comma separated), 'all' runs every tag"
      type: string
      default: "all"
    extra_args:
      description: "Extra args ansible-playbook"
      type: string
      default: ""
    has_vault:
      description: "Use --vault-password-file"
      type: boolean
      default: false
    inventory_path:
      description: "Path to the inventory file from root"
      type: string
      default: "inventory/hosts.yaml"
    playbooks_path:
      description: "Path to the playbook's dir from root"
      type: string
      default: "playbooks"
---

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - check
  - deploy

default:
  tags:
    - docker_infra

variables:
  INVENTORY: $[[ inputs.inventory_path ]]
  PLAYBOOKS_DIR: $[[ inputs.playbooks_path ]]
  ANSIBLE_IMAGE: "$CI_REGISTRY/bro-infra/docker-images/ansible:main-latest"
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_CONFIG: $CI_PROJECT_DIR/ansible.cfg
  ANSIBLE_USER: ansible

.before_script_ansible:
  - ansible-galaxy install -r requirements.yml
  - eval $(ssh-agent -s)
  - cat "$ANSIBLE_SSH_PRIVATE_KEY" | base64 -d | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - cat "$SSH_KNOWN_HOSTS" | base64 -d > ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts

# =====
# Check diff playbook
# =====
"$[[ inputs.playbook ]] - $[[ inputs.limit ]] - $[[ inputs.tags ]] - check":
  image: $ANSIBLE_IMAGE
  stage: check
  needs: []
  before_script:
    - !reference [.before_script_ansible]
  variables:
    ANSIBLE_ARGS: &ansible_args |
      --inventory $INVENTORY
      --limit $[[ inputs.limit ]]
      --tags $[[ inputs.tags ]]
      --user $ANSIBLE_USER
      $[[ inputs.extra_args ]]
  script:
    - if $[[ inputs.has_vault ]]; then ANSIBLE_ARGS="$ANSIBLE_ARGS --vault-password-file ${ANSIBLE_VAULT_PASSWORD_FILE}"; fi
    - echo ${ANSIBLE_ARGS}
    - ansible-playbook ${ANSIBLE_ARGS} ${PLAYBOOKS_DIR}/$[[ inputs.playbook ]].yml -C -D --become
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# =====
# Deploy playbook
# =====
"$[[ inputs.playbook ]] - $[[ inputs.limit ]] - $[[ inputs.tags ]] - deploy":
  image: $ANSIBLE_IMAGE
  stage: deploy
  before_script:
    - !reference [.before_script_ansible]
  variables:
    ANSIBLE_ARGS: *ansible_args
  script:
    - if $[[ inputs.has_vault ]]; then ANSIBLE_ARGS="$ANSIBLE_ARGS --vault-password-file ${ANSIBLE_VAULT_PASSWORD_FILE}"; fi
    - echo ${ANSIBLE_ARGS}
    - ansible-playbook ${ANSIBLE_ARGS} ${PLAYBOOKS_DIR}/$[[ inputs.playbook ]].yml -D --become
  needs:
    - "$[[ inputs.playbook ]] - $[[ inputs.limit ]] - $[[ inputs.tags ]] - check"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
