---
- name: Install repository dependencies
  ansible.builtin.dnf:
    name: "{{ docker_dependencies }}"
    state: present

- name: Remove conflicting packages
  ansible.builtin.dnf:
    name: "{{ docker_conflicting_packages }}"
    state: absent
  when: docker_remove_conflicting_packages | bool

- name: Import Docker GPG key
  ansible.builtin.rpm_key:
    key: "https://download.docker.com/linux/{{ docker_repo_distro }}/gpg"
    state: present

- name: Add Docker yum repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: "https://download.docker.com/linux/{{ docker_repo_distro }}/$releasever/$basearch/stable"
    gpgcheck: true
    gpgkey: "https://download.docker.com/linux/{{ docker_repo_distro }}/gpg"
    enabled: true

- name: Install Docker packages
  ansible.builtin.dnf:
    name: "{{ docker_packages }}"
    state: "{{ 'latest' if (docker_package_state == 'latest' and not docker_version_pinned) else 'present' }}"
    allow_downgrade: "{{ docker_version_pinned | bool }}"
  notify: Restart docker
