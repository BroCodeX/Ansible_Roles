  # net.ipv6.conf.all.disable_ipv6: 1
  # net.ipv6.conf.default.disable_ipv6: 1
  # net.ipv6.conf.lo.disable_ipv6: 1

# ulimit
pam_limits: {}
  # - domain: '*'
  #   limit_type: hard
  #   limit_item: nofile
  #   value: 64000
  # - domain: '*'
  #   limit_type: soft
  #   limit_item: nofile
  #   value: 64000
  # - domain: root
  #   limit_type: hard
  #   limit_item: nofile
  #   value: 64000
  # - domain: root
  #   limit_type: soft
  #   limit_item: nofile
  #   value: 64000

# swap
swap_enable: false
swap_file_size: "2048M"
swap_file_path: /swapfile

# s3cmd
s3cmd_install: false
s3cmd_config_path: /root/.s3cfg
s3cmd_config_owner: root
s3cmd_config_group: root
s3cmd_config_mode: 0600
s3_provider: ""
s3_pool: ~
s3_access_key: ~
s3_secret_key: ~
s3cmd_config:
  selectel:
    bucket_location: "{{ s3_pool }}"
    host_base: s3.{{ s3_pool }}.storage.selcloud.ru
    host_bucket: "%(bucket)s.s3.{{ s3_pool }}.storage.selcloud.ru"
    access_key: "{{ s3_access_key }}"
    secret_key: "{{ s3_secret_key }}"
  yandex:
    bucket_location: ru-central1
    host_base: storage.yandexcloud.net
    host_bucket: "%(bucket)s.storage.yandexcloud.net"
    access_key: "{{ s3_access_key }}"
    secret_key: "{{ s3_secret_key }}"
