---
# base software
upgrade_all: false
base_packages:
  - vim
  - rsync
  - strace
  - lsof
  - atop
  - htop
  - whois
  - net-tools
  - traceroute
  - tcpdump
  - screen
  - wget
  - curl
  - iftop
  - git
  - bc
  - smartmontools
  - ncdu
  - jq
  - pigz
  - pv
  - lsyncd

additional_packages: []

etc_hosts: {}

# timezone
set_timezone: false
tz_name: UTC

# sysctl
sysctl_parameters: {}
