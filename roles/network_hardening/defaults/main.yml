---
iptables_allowed_tcp_ports: [22, 80, 443]   # открыты по умолчанию
iptables_docker_enabled: true # true — хост крутит Docker: FORWARD не режется
                               # (Docker сам выставит policy/цепочки), включается
                               # ip_forward, после reload правил перезапускается docker

sysctl_conf_path: /etc/sysctl.d/99-hardening.conf
sysctl_params:
  - { name: 'net.ipv4.conf.all.accept_redirects',     value: 0 }
  - { name: 'net.ipv4.conf.default.accept_redirects', value: 0 }
  - { name: 'net.ipv6.conf.all.accept_redirects',     value: 0 }
  - { name: 'net.ipv6.conf.default.accept_redirects', value: 0 }
  - { name: 'net.ipv4.conf.all.send_redirects',       value: 0 }
  - { name: 'net.ipv4.conf.all.log_martians',         value: 0 }
  - { name: 'net.ipv4.conf.default.log_martians',     value: 0 }
  - { name: 'net.ipv4.conf.all.rp_filter',            value: 1 }
  - { name: 'kernel.yama.ptrace_scope',               value: 1 }
  - { name: 'kernel.kptr_restrict',                   value: 2 }
  - { name: 'kernel.sysrq',                           value: 0 }
  - { name: 'net.ipv4.ip_forward',                    value: "{{ 1 if iptables_docker_enabled else 0 }}" }
  - { name: 'net.ipv6.conf.all.forwarding',           value: "{{ 1 if iptables_docker_enabled else 0 }}" }
