---
- name: Check if Ansible is installed.
  ansible.builtin.command: "{{ ansible_bin_path }} --version"
  register: ansible_check
  changed_when: false
  failed_when: false

- name: Get installed Ansible package version.
  ansible.builtin.command: >-
    {{ ansible_venv_path }}/bin/python -m pip show {{ ansible_pip_package }}
  register: ansible_package_info
  changed_when: false
  failed_when: false
  when: ansible_check.rc == 0

- name: Set installed Ansible version.
  ansible.builtin.set_fact:
    ansible_installed_version: >-
      {{ (ansible_package_info.stdout | regex_findall('Version:\s*([^\n\r]+)') | first) | default('') }}
  when: ansible_check.rc == 0

- name: Debug Ansible version parsing.
  ansible.builtin.debug:
    msg:
      - "raw={{ ansible_package_info.stdout | default('') }}"
      - "parsed={{ ansible_installed_version | default('') }}"
      - "target={{ ansible_install_version }}"
  when: ansible_check.rc == 0

- name: Set Ansible install state.
  ansible.builtin.set_fact:
    ansible_needs_install: >-
      {{ ansible_check.rc != 0
      or (
        (ansible_install_version | default('') | length) > 0
        and (ansible_installed_version | default('')) != ansible_install_version
      ) }}

- name: Install Ansible via Pip.
  ansible.builtin.pip:
    name: >-
      {{ ansible_pip_package }}{{ '==' ~ ansible_install_version
      if (ansible_install_version | default('') | length) > 0 else '' }}
    virtualenv: "{{ ansible_venv_path }}"
    virtualenv_command: python3 -m venv
    extra_args: >-
      {{ ansible_install_pip_extra_args
      if (ansible_install_pip_extra_args | default('') | length) > 0 else omit }}
  become: true
  when: ansible_needs_install | bool

- name: Link managed Ansible binaries.
  ansible.builtin.file:
    src: "{{ ansible_venv_path }}/bin/{{ item }}"
    dest: "{{ bin_path }}/{{ item }}"
    state: link
    force: true
  loop: "{{ ansible_managed_binaries }}"
  become: true
  when: ansible_needs_install | bool

- name: Get final Ansible version.
  ansible.builtin.command: "{{ ansible_bin_path }} --version"
  register: ansible_final_version
  changed_when: false

- name: Display Ansible version.
  ansible.builtin.debug:
    msg: "{{ ansible_final_version.stdout_lines | first }}"
