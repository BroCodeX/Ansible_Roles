---
- name: Check if minikube is already installed
  ansible.builtin.command: minikube version
  register: minikube_check
  ignore_errors: true
  changed_when: false

- name: Show existing minikube version
  ansible.builtin.debug:
    msg: "minikube already installed: {{ minikube_check.stdout }}"
  when: minikube_check.rc == 0

- name: Create temporary file for minikube download
  ansible.builtin.tempfile:
    state: file
    suffix: minikube
  register: minikube_tmp
  when: minikube_check.rc != 0

- name: Download latest minikube binary
  ansible.builtin.shell: >
    curl -Lo {{ minikube_tmp.path }} https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
  when: minikube_check.rc != 0

- name: Make minikube executable
  ansible.builtin.file:
    path: "{{ minikube_tmp.path }}"
    mode: '0755'
  when: minikube_check.rc != 0

- name: Ensure {{ minikube_bin_path }} exists
  ansible.builtin.file:
    path: "{{ minikube_bin_path }}"
    state: directory
    mode: '0755'
  become: true
  when: minikube_check.rc != 0

- name: Move minikube binary to {{ minikube_bin_path }}
  ansible.builtin.command:
    cmd: install {{ minikube_tmp.path }} {{ minikube_bin_path }}/
  become: true
  args:
    creates: "{{ minikube_bin_path }}/minikube"
  when: minikube_check.rc != 0

- name: Verify minikube installation
  ansible.builtin.command: minikube version
  register: minikube_version_check
  changed_when: false
  when: minikube_check.rc != 0

- name: Show installed minikube version
  ansible.builtin.debug:
    msg: "minikube just installed: {{ minikube_version_check.stdout }}"
  when: minikube_check.rc != 0
