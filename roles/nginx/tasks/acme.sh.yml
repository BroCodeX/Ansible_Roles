- name: acme.sh | Install dependencies
  ansible.builtin.package:
    name: "{{ item }}"
    state: "present"
  loop: "{{ nginx_acme_sh_dependencies }}"

- name: acme.sh | Create git clone path
  ansible.builtin.file:
    path: "{{ nginx_acme_sh_git_clone_dest | dirname }}"
    state: "directory"
    owner: "{{ nginx_acme_sh_become_user }}"
    group: "{{ nginx_acme_sh_become_user }}"
    mode: "0755"

- name: acme.sh | Git clone
  ansible.builtin.git:
    repo: "{{ nginx_acme_sh_git_url }}"
    version: "{{ nginx_acme_sh_git_version }}"
    dest: "{{ nginx_acme_sh_git_clone_dest }}"
    update: "{{ nginx_acme_sh_git_update }}"
  become: true
  become_user: "{{ nginx_acme_sh_become_user }}"

- name: acme.sh | Install acme.sh
  ansible.builtin.command: >-
    ./acme.sh --install --log
    --days {{ nginx_acme_sh_renew_time_in_days }}
    {{ "--accountemail " + nginx_acme_sh_account_email if nginx_acme_sh_account_email else "" }}
  args:
    chdir: "{{ nginx_acme_sh_git_clone_dest }}"
    creates: "~/.acme.sh/acme.sh"
  become: true
  become_user: "{{ nginx_acme_sh_become_user }}"
  when: not ansible_check_mode
