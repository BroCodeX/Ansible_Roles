# {{ ansible_managed }}
# https://github.com/netbirdio/netbird/blob/main/combined/config.yaml.example
server:
  listenAddress: ":80"
  exposedAddress: "{{ netbird_http_protocol }}://{{ netbird_domain }}:{{ netbird_port }}"
  stunPorts:
    - {{ netbird_stun_port }}
  metricsPort: {{ netbird_metrics_port }}
  healthcheckAddress: ":{{ netbird_healthcheck_port }}"
  logLevel: {{ netbird_server_log_level }}
  logFile: "console"

  authSecret: "{{ netbird_relay_auth_secret }}"
  dataDir: "/var/lib/netbird"
  disableAnonymousMetrics: true

  auth:
    issuer: "{{ netbird_idp_issuer }}"
    signKeyRefreshEnabled: true
    dashboardRedirectURIs:
      - "{{ netbird_http_protocol }}://{{ netbird_domain }}{{ netbird_auth_redirect_uri }}"
      - "{{ netbird_http_protocol }}://{{ netbird_domain }}{{ netbird_auth_silent_redirect_uri }}"
    cliRedirectURIs:
      - "http://localhost:53000/"

  store:
    engine: "sqlite"
    encryptionKey: {{ netbird_datastore_encryption_key }}
