# {{ ansible_managed }}

name: {{ docker_compose_project_name }}

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:

services:

  keycloak:
    image: {{ keycloak_image }}
    container_name: keycloak
    command: {{ keycloak_command }}
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      KC_DB: {{ keycloak_db_engine }}
      KC_DB_USERNAME: {{ keycloak_db_username }}
      KC_DB_PASSWORD: {{ keycloak_db_password }}
      KC_DB_URL: {{ keycloak_db_url }}
      KC_BOOTSTRAP_ADMIN_USERNAME: {{ keycloak_bootstrap_admin_username }}
      KC_BOOTSTRAP_ADMIN_PASSWORD: {{ keycloak_bootstrap_admin_password }}
      KC_METRICS_ENABLED: {{ keycloak_metrics_enabled }}
      KC_EVENT_METRICS_USER_ENABLED: {{ keycloak_event_metrics_user_enabled }}
      KC_EVENT_METRICS_USER_EVENTS: {{ keycloak_event_metrics_user_events }}
      KC_HEALTH_ENABLED: {{ keycloak_health_enabled }}
      KC_LOG_LEVEL: {{ keycloak_log_level }}
      KC_LOG_LEVEL_ORG_KEYCLOAK_EVENTS: {{ keycloak_log_level_org_keycloak_events }}
      KC_HOSTNAME: {{ keycloak_hostname }}
      KC_HTTP_MAX_QUEUED_REQUESTS: {{ keycloak_http_max_queued_requests }}
      KC_HTTP_ENABLED: {{ keycloak_http_enabled }}
      KC_PROXY_HEADERS: {{ keycloak_proxy_headers }}
      KC_PROXY_TRUSTED_ADDRESSES: {{ keycloak_proxy_trusted_addresses }}
    ports:
      - {{ keycloak_web_host }}:{{ keycloak_web_port }}:8080
      - {{ keycloak_management_host }}:{{ keycloak_management_port }}:9000
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/{{ keycloak_management_port }}"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: &logging
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 800M
          pids: 512
        reservations:
          cpus: '0.2'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    restart: unless-stopped
    image: {{ keycloak_postgres_image }}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      POSTGRES_PASSWORD: {{ postgres_password }}
      POSTGRES_USER: {{ postgres_user }}
      POSTGRES_DB: {{ postgres_db }}
    volumes:
      - "postgres-data:/var/lib/postgresql"
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 800M
          pids: 256
        reservations:
          cpus: '0.2'
          memory: 256M
