---
- name: Create ldap project directory
  ansible.builtin.file:
    path: "{{ ldap_project_path }}"
    state: directory
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ ldap_project_path }}/docker-compose.yml"
    mode: "0640"
  no_log: "{{ ldap_compose_no_log }}"

- name: docker compose up
  community.docker.docker_compose_v2:
    project_src: "{{ ldap_project_path }}"
    project_name: "{{ ldap_compose_project_name }}"
    state: present
    pull: policy
    remove_orphans: true
    recreate: auto
    wait: true
    wait_timeout: 60
  when: not ansible_check_mode
