---
# Pull secrets from Vault via the community.hashi_vault lookup plugin and
# assemble them into k8s_manifest_vault_secrets ({key: value}), which render.yml
# merges into the Secret manifest. Lookups run on the control node.

- name: Read static KV v2 secrets from Vault
  ansible.builtin.set_fact:
    k8s_manifest_vault_kv_raw: >-
      {{ lookup('community.hashi_vault.vault_kv2_get',
                k8s_manifest_vault_kv_path,
                engine_mount_point=k8s_manifest_vault_kv_mount,
                url=k8s_manifest_vault_addr,
                auth_method=k8s_manifest_vault_auth_method,
                token=k8s_manifest_vault_token,
                validate_certs=k8s_manifest_vault_validate_certs) }}
  no_log: true
  when: k8s_manifest_vault_kv_enabled | bool

- name: Read dynamic credentials from Vault
  ansible.builtin.set_fact:
    k8s_manifest_vault_dynamic_raw: >-
      {{ lookup('community.hashi_vault.vault_read',
                k8s_manifest_vault_dynamic_mount ~ '/creds/' ~ k8s_manifest_vault_dynamic_role,
                url=k8s_manifest_vault_addr,
                auth_method=k8s_manifest_vault_auth_method,
                token=k8s_manifest_vault_token,
                validate_certs=k8s_manifest_vault_validate_certs) }}
  no_log: true
  when: k8s_manifest_vault_dynamic_enabled | bool

- name: Assemble secrets pulled from Vault
  ansible.builtin.set_fact:
    k8s_manifest_vault_secrets: >-
      {{ (k8s_manifest_vault_kv_raw.secret | default({})
            | dict2items
            | selectattr('key', 'in', _kv_wanted)
            | items2dict)
         | combine(_dynamic_selected) }}
  vars:
    # Keep all KV keys, or only the requested subset.
    _kv_wanted: >-
      {{ (k8s_manifest_vault_kv_keys | length > 0)
         | ternary(k8s_manifest_vault_kv_keys,
                   (k8s_manifest_vault_kv_raw.secret | default({})) | list) }}
    _dynamic_data: "{{ k8s_manifest_vault_dynamic_raw.data | default({}) }}"
    _dynamic_selected: >-
      {{ (k8s_manifest_vault_dynamic_enabled | bool)
         | ternary(_dynamic_data | dict2items
                     | selectattr('key', 'in', k8s_manifest_vault_dynamic_keys)
                     | items2dict,
                   {}) }}
  no_log: true
